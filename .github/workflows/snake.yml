name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
      # checkout atualizado
        uses: actions/checkout@v4

      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: vitoraugusto1079
          outputs: |
            dist/snake.svg?color_snake=#5E81AC&color_dots=#ECEFF4,#A3BE8C,#88C0D0,#81A1C1,#5E81AC
            dist/snake-dark.svg?palette=github-dark&color_snake=#88C0D0&color_dots=#2E3440,#3B4252,#4C566A,#81A1C1,#88C0D0

      - name: Upload Snake Artifacts
      # versão atualizada (v4)
        uses: actions/upload-artifact@v4
        with:
          name: snake
          path: dist

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
